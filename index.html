<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Khảo sát</title>
  <style>
  :root {
    color-scheme: dark;
    --bg: #090d1b;
    --panel: #151a2c;
    --text: #f5f2ff;
    --muted: #aab3cc;
    --accent: #c8b6ff;
    --danger: #fca5a5;
    --border: #ffffff18;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 50% 0%, #332650 0%, transparent 48%),
      linear-gradient(160deg, #0c1121, #080b16 80%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  main {
    width: min(100%, 620px);
    padding: clamp(24px, 5vw, 40px);
    border: 1px solid var(--border);
    border-radius: 26px;
    background: linear-gradient(
      145deg,
      rgba(27, 32, 54, .97),
      rgba(17, 22, 39, .98)
    );
    box-shadow: 0 24px 75px #0006;
  }

  .eyebrow {
    margin: 0 0 14px;
    color: var(--accent);
    font-size: .75rem;
    font-weight: 750;
    letter-spacing: .12em;
    line-height: 1.7;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.85rem, 5vw, 2.5rem);
    line-height: 1.18;
    letter-spacing: -.035em;
  }

  .intro {
    margin: 16px 0 28px;
    color: var(--muted);
    font-size: .96rem;
    line-height: 1.8;
  }

  form {
    display: flex;
    gap: 10px;
  }

  input {
    min-width: 0;
    flex: 1;
    padding: 15px 16px;
    border: 1px solid #465171;
    border-radius: 14px;
    background: #0c1120;
    color: var(--text);
    font: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  input::placeholder {
    color: #818ba5;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px #c8b6ff1c;
  }

  button {
    padding: 15px 21px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #ded2ff, #bca6fa);
    color: #211831;
    font: inherit;
    font-weight: 750;
    cursor: pointer;
    transition: filter .2s, transform .15s;
  }

  button:hover {
    filter: brightness(1.08);
  }

  button:active {
    transform: scale(.98);
  }

  #message {
    min-height: 0;
    margin: 8px 0 0;
    color: var(--danger);
    font-size: .9rem;
    line-height: 1.6;
  }

  #result {
    margin-top: 22px;
    animation: appear .35s ease both;
  }

  #videoTitle {
    margin: 0 0 14px;
    font-size: 1.2rem;
    line-height: 1.5;
  }

  

.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: visible;
  border: 1px solid #ffffff20;
  border-radius: 16px;
  background: #000;
  box-shadow: 0 12px 30px #0003;
}

.player iframe,
.player video {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: inherit;
}



  .hidden {
    display: none !important;
  }

  .hint {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #ffffff12;
    color: var(--muted);
    font-size: .83rem;
    line-height: 1.75;
  }

  @keyframes appear {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 16px 12px;
      place-items: start center;
    }

    main {
      padding: 25px 20px;
      border-radius: 23px;
    }

    .intro {
      margin-bottom: 23px;
    }

    form {
      flex-direction: column;
      gap: 10px;
    }

    input,
    button {
      width: 100%;
      min-height: 52px;
    }

    #result {
      margin-top: 20px;
    }

    #videoTitle {
      font-size: 1.15rem;
    }

    .player {
      border-radius: 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>

</head>
<body>
  <main>
    <p class="eyebrow">Học sinh được yêu cầu thực hiện bài khảo sát.</p>
    <h1>Vui lòng nhập tên của bạn.</h1>
    <p class="intro">Thí sinh vui lòng nhập đúng và đủ họ và tên nếu không sẽ không thể truy cập.</p>
    <form id="codeForm">
      <input id="codeInput" name="code" type="text" placeholder="Nhập tên."
             autocomplete="off" autocapitalize="words" aria-label="Tên của bạn." maxlength="30" required>
      <button type="submit">Bắt đầu ↗</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="result" class="hidden" aria-live="polite">
      <h2 id="videoTitle"></h2>
      <div class="player" id="player"></div>
    </section>
    <p class="hint">Nếu tên chưa đúng, hãy kiểm tra rồi thử lại. Trang này dùng tên của bạn để tổng hợp kết quả khảo sát, không phải hệ thống bảo mật.</p>
  </main>

  <script>
    
    const VIDEOS = {
      "lê an na":  { title: "Tặng An Na 💌",  type: "drive", url: "https://drive.google.com/file/d/1x08EILn66bvF7pnvZnZVDK-NAzxPl1aY/preview" },
      "nguyễn lục phương giang":  { title: "Tặng Phương Giang 💌",  type: "drive", url: "https://drive.google.com/file/d/1lZvMcH0MQfs5s9n3e3O-WSQgi1Q342Np/preview" },
      "nguyễn thị huệ":  { title: "Tặng cô Huệ 💌",  type: "drive", url: "https://drive.google.com/file/d/1RXMjoi-fIY0UkAM-XDekj8Lor_rw5UXE/preview" },
      "lê ngọc khanh":  { title: "Tặng Ngọc Khanh 💌",  type: "drive", url: "https://drive.google.com/file/d/158W755EnoEdNZkKJktYMK0ybxQcqD8rD/preview" },
      "nguyễn thùy lâm":  { title: "Tặng Thùy Lâm 💌",  type: "drive", url: "https://drive.google.com/file/d/1V7xWxwljGVB_Gq5I5gRnwQG8vHK2DjH0/preview" },
      "đỗ phương nhung":  { title: "Tặng Phương Nhung 💌",  type: "drive", url: "https://drive.google.com/file/d/11T8WDT7lT5eg9hIKkJnhlcsHsXh5wrsY/preview" },
      "nguyễn bảo ngọc":  { title: "Tặng Nguyễn Bảo Ngọc 💌",  type: "drive", url: "https://drive.google.com/file/d/1vOin-cEDna9UydOBPjEgzOmK7QT9uQ80/preview" },
      "phạm huỳnh bảo ngọc":  { title: "Tặng Phạm Huỳnh Bảo Ngọc 💌",  type: "drive", url: "https://drive.google.com/file/d/17P7dS2eT90aaFEMkdbIp5XkjaOlfS09J/preview" },
      "phạm hoàng bảo như":  { title: "Tặng Bảo Như 💌",  type: "drive", url: "https://drive.google.com/file/d/1Mnmuf71IlsfpsIoP91zsf5L3B_bMiPl-/preview" },
      "nguyễn ngọc quỳnh như":  { title: "Tặng Quỳnh Như 💌",  type: "drive", url: "https://drive.google.com/file/d/1yMg192bRNsEh_D21wOkvYH5RsSFIr2NI/preview" },
      "vương minh châu":  { title: "Tặng Minh Châu 💌",  type: "drive", url: "https://drive.google.com/file/d/1RNpFUhMEowk_7_f4kA8yPMFyqGIeQOwP/preview" },
      "châu nguyễn uyên thanh":  { title: "Tặng Uyên Thanh 💌",  type: "drive", url: "https://drive.google.com/file/d/1blDmBen8bMSLhaVt2Q5DeW1QxRFfkwGq/preview" },
      "nguyễn khánh tâm":  { title: "Tặng Khánh Tâm",  type: "drive", url: "https://drive.google.com/file/d/1ec9LoMOEDISRcqieU1Giql_1KaNJchbY/preview" },
      "phạm huỳnh song thư":  { title: "Tặng Song Thư 💌",  type: "drive", url: "https://drive.google.com/file/d/1WQAGES-gnkz9WfhWWr6ZIchDb4SJbGOV/preview" },
      "vương ánh tây":  { title: "Tặng Ánh Tây 💌",  type: "drive", url: "https://drive.google.com/file/d/1VRKtJzzSSd2WtLjtVIDzifl_mb4mt2O2/preview" },
      "trần ngọc tú vy":  { title: "Tặng Tú Vy 💌",  type: "drive", url: "https://drive.google.com/file/d/1LLtsmpG9f0pmnUv_NkmyOsPGnFZnzmKU/preview" },
      "nguyễn khánh vy":  { title: "Tặng Khánh Vy 💌",  type: "drive", url: "https://drive.google.com/file/d/1DFqgelsqkY5gxEF_5ATPXm4QZarhYNMO/preview" },
      "nguyễn trúc vy":  { title: "Tặng Trúc Vy 💌",  type: "drive", url: "https://drive.google.com/file/d/1zt7ELyZbucv22SyOh7mRWiyTEZe1XtI_/preview" },
      "đỗ hoàng yến":  { title: "Tặng Hoàng Yến 💌",  type: "drive", url: "https://drive.google.com/file/d/1PIdOMwZmWLjlNIsyTAQenHkD_UonvDgl/preview" },
      "uông hoàng yến vy":  { title: "Tặng Yến Vy 💌",  type: "drive", url: "https://drive.google.com/file/d/1QLkxnMDMgaJ5rURfu6S7yLA7X7iS83-_/preview" }
    };

    const form = document.getElementById("codeForm");
    const input = document.getElementById("codeInput");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const title = document.getElementById("videoTitle");
    const player = document.getElementById("player");

    function showVideo(code) {
      const video = VIDEOS[code];
      player.replaceChildren();

      if (!video) {
        result.classList.add("hidden");
        message.textContent = "Không tồn tại tên này.";
        return;
      }

      if (!video.url || video.url.startsWith("PASTE_")) {
        result.classList.add("hidden");
        message.textContent = "Không tồn tại tên này.";
        return;
      }

      title.textContent = video.title;

      if (video.type === "mp4") {
        const media = document.createElement("video");
        media.controls = true;
        media.playsInline = true;
        media.preload = "metadata";
        media.src = video.url;
        player.appendChild(media);
      } else {
        const frame = document.createElement("iframe");

	const separator = video.url.includes("?") ? "&" : "?";
        frame.src = video.url + separator + "autoplay=1";
        frame.title = video.title;
        frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        frame.allowFullscreen = true;
        frame.referrerPolicy = "strict-origin-when-cross-origin";

        player.appendChild(frame);
      }

      message.textContent = "";
      result.classList.remove("hidden");
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      showVideo(input.value.trim().toLocaleLowerCase("vi"));
    });
  </script>
</body>
</html>
